apply plugin: 'com.android.application'

android {
    namespace 'com.cymatic.disciplineos'
    compileSdk 34

    defaultConfig {
        applicationId "com.cymatic.disciplineos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE') && file(property('RELEASE_STORE_FILE')).exists()) {
                storeFile file(property('RELEASE_STORE_FILE'))
                storePassword property('RELEASE_STORE_PASSWORD')
                keyAlias property('RELEASE_KEY_ALIAS')
                keyPassword property('RELEASE_KEY_PASSWORD')
            } else {
                // Fallback debug-signed release or placeholder for CI builds when keystore is absent
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
