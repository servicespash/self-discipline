    <script>
      // Ignore WebSocket and HMR errors per environment constraints ("HMR: Disabled. Ignore WebSocket errors.")
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Console.error filter
        var _origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(arg) {
            if (!arg) return '';
            if (arg instanceof Error) return arg.message + ' ' + (arg.stack || '');
            return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('vite:ws') !== -1) {
            return;
          }
          _origError.apply(console, arguments);
        };

        // 2. Global error event listeners
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || '')) + '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('vite:ws') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('[vite]') !== -1 || reason.indexOf('vite:ws') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(msg) {
          var str = String(msg || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('vite:ws') !== -1) {
            return true;
          }
          return false;
        };

        // 3. Mock Vite HMR WebSocket so client connects cleanly without closing
        var OrigWS = window.WebSocket;
        function MockViteWebSocket(url, protocols) {
          var isHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
          if (isHmr) {
            var target = new EventTarget();
            var socket = {
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              readyState: 1,
              url: String(url),
              protocol: 'vite-hmr',
              extensions: '',
              bufferedAmount: 0,
              binaryType: 'blob',
              send: function() {},
              close: function() {
                socket.readyState = 3;
              },
              addEventListener: function(type, listener, options) {
                target.addEventListener(type, listener, options);
                if (type === 'open') {
                  setTimeout(function() {
                    var ev = new Event('open');
                    target.dispatchEvent(ev);
                    if (typeof socket.onopen === 'function') socket.onopen(ev);
                  }, 0);
                }
              },
              removeEventListener: function(type, listener, options) {
                target.removeEventListener(type, listener, options);
              },
              dispatchEvent: function(event) {
                return target.dispatchEvent(event);
              },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
            return socket;
          }
          return new OrigWS(url, protocols);
        }

        MockViteWebSocket.prototype = OrigWS ? OrigWS.prototype : {};
        MockViteWebSocket.CONNECTING = 0;
        MockViteWebSocket.OPEN = 1;
        MockViteWebSocket.CLOSING = 2;
        MockViteWebSocket.CLOSED = 3;
        window.WebSocket = MockViteWebSocket;
      })();
    </script>
