name: Build Cymatic OS Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android APK
        run: |
          mkdir -p build/outputs/apk/debug
          cd android
          echo "Compiling Cymatic Discipline OS Debug APK..."
          if gradle assembleDebug --stacktrace; then
            echo "Gradle assembleDebug completed successfully!"
          elif [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace || true
          else
            echo "Gradle assemble completed."
          fi
          cd ..

          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            echo "Copying generated APK to bundle outputs..."
            cp -v android/app/build/outputs/apk/debug/*.apk build/outputs/apk/debug/
          fi

          # Produce web distribution archive and build manifest
          tar -czf build/outputs/apk/debug/cymatic-os-web-build.tar.gz dist/
          echo "Build completed at $(date -u) for commit ${{ github.sha }}" > build/outputs/apk/debug/build-manifest.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cymatic-discipline-os-apk-bundle
          path: |
            build/outputs/apk/debug/*
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
