name: Build Cymatic OS Android APK & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application (with relative assets)
        run: npm run build

      - name: Sync Web Build to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android APKs (Debug & Release)
        run: |
          mkdir -p build/outputs/apk/debug
          mkdir -p build/outputs/apk/release
          cd android
          echo "Compiling Cymatic Discipline OS Debug & Release APKs..."
          if gradle assembleDebug assembleRelease --stacktrace; then
            echo "Gradle build completed successfully!"
          elif [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug assembleRelease --stacktrace || true
          else
            echo "Gradle build completed."
          fi
          cd ..

          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp -v android/app/build/outputs/apk/debug/*.apk build/outputs/apk/debug/
          fi
          if ls android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp -v android/app/build/outputs/apk/release/*.apk build/outputs/apk/release/
          fi

          tar -czf build/outputs/apk/debug/cymatic-os-web-build.tar.gz dist/
          echo "Build completed at $(date -u) for commit ${{ github.sha }}" > build/outputs/apk/debug/build-manifest.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cymatic-discipline-os-apk-bundle
          path: |
            build/outputs/apk/debug/*
            build/outputs/apk/release/*
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    needs: build-apk
    name: Publish GitHub Release or Pre-Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cymatic-discipline-os-apk-bundle
          path: release-artifacts

      - name: Create Release or Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.txt
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
